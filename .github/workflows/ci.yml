name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Le build attrape ce que les trois précédents laissent passer : un
      # composant Vue vide, une route qui a changé de nom, un attrape-tout qui
      # avale une route d'API. Vu trois fois en une journée.
      - run: pnpm build
